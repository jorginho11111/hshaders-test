# Mellow for Horizon — a conversion of Mellow Shaders (Iris/OptiFine, GLSL)
# to the Horizon shader API (WGSL), schema 1.
# Original: "Mellow" by TheCMK, https://codeberg.org/TheCMK/mellow-shader (MIT).
# Targets the API surface of Horizon Android 0.7.7 (weather and post stages;
# no [vertex] stage and no MaterialInput.colored_light on that build).
# v0.1.2: the [material] stage (material.wgsl) is disabled — it needs 19
# sampled textures in the terrain pipeline and mobile GPUs cap 16 (refused).
# v0.1.3: the [sky] stage (sky.wgsl) is disabled too — the app's sky pipeline
# layout exceeds that same limit and wgpu panics uncaptured (closes the app).
# Both files stay in the repo, ready for when the app slims its layouts.
schema = 1
id = "mellow"
name = "Mellow"
version = "0.1.3"
api = "0.1"
description = "A painterly, gameplay-first conversion of Mellow Shaders: vivid colour grading, soft bloom and shaped weather."
authors = ["TheCMK (original Mellow shaderpack)", "Horizon WGSL conversion"]
license = "MIT"
shared = ["shared.wgsl"]

[weather]
file = "weather.wgsl"

[[post]]
file = "post_glow.wgsl"
name = "Bloom"

[[post]]
file = "post_grade.wgsl"
name = "Tone map and grade"

# --- Weather ---

[[options]]
id = "weather_opacity"
name = "Weather opacity"
description = "How strongly rain and snow streaks show."
type = "float"
default = 1.0
min = 0.1
max = 1.0
step = 0.05

# --- Bloom (BLOOM_STRENGTH, BLOOM_CURVE) ---

[[options]]
id = "bloom_strength"
name = "Bloom strength"
description = "The soft halo around bright things (BLOOM_STRENGTH)."
type = "float"
default = 0.4
min = 0.0
max = 0.8
step = 0.02

[[options]]
id = "bloom_curve"
name = "Bloom curve"
description = "Where bloom starts to pick up brightness (BLOOM_CURVE)."
type = "float"
default = 0.5
min = 0.1
max = 1.0
step = 0.05

# --- Tone map and colour grade (Mellow's final pass) ---

[[options]]
id = "tonemap"
name = "Tone mapping"
description = "Uchimura is Mellow's default operator; AgX Punchy and the fitted ACES curve are two of its others."
type = "choice"
values = ["Uchimura", "AgX Punchy", "ACES", "None"]
default = "Uchimura"

[[options]]
id = "exposure"
name = "Exposure"
description = "Brightness before tone mapping."
type = "float"
default = 1.1
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "vibrance"
name = "Vibrance"
description = "Lifts quiet colours without overdoing strong ones (VIBRANCE)."
type = "float"
default = 1.2
min = 0.0
max = 2.0
step = 0.02

[[options]]
id = "saturation"
name = "Saturation"
description = "How colourful the picture is (SATURATION)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.02

[[options]]
id = "contrast"
name = "Contrast"
description = "Punches the picture up or softens it (CONTRAST)."
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.01

[[options]]
id = "vignette_opacity"
name = "Vignette"
description = "Darkens the corners of the picture (VIGNETTE_OPACITY, 0 turns it off)."
type = "float"
default = 0.0
min = 0.0
max = 2.0
step = 0.25

[[options]]
id = "vignette_falloff"
name = "Vignette falloff"
description = "How far the vignette reaches in (VIGNETTE_FALLOFF)."
type = "float"
default = 0.75
min = 0.0
max = 1.5
step = 0.25

[[options]]
id = "film_grain"
name = "Film grain"
description = "A whisper of grain over the picture (FILM_GRAIN, off by default like Mellow)."
type = "bool"
default = false

[[options]]
id = "film_grain_strength"
name = "Film grain strength"
description = "How loud the grain is (FILM_GRAIN_STRENGTH)."
type = "float"
default = 0.05
min = 0.025
max = 0.2
step = 0.025

[budget]
gpu_ms = 1.5
