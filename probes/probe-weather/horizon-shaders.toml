schema = 1
id = "probe_weather"
name = "Probe Weather"
version = "0.0.1"
api = "0.1"
description = "Crash-bisect probe for Horizon Android 0.7.7 (only the weather stage of the Mellow pack)."
authors = ["TheCMK (original Mellow Shaders)", "conversion: jorginho11111"]
license = "MIT"
shared = ["shared.wgsl"]

[[options]]
id = "weather_opacity"
name = "Weather opacity"
description = "How strongly rain and snow streaks show."
type = "float"
default = 1.0
min = 0.1
max = 1.0
step = 0.05

# --- Bloom (BLOOM_STRENGTH, BLOOM_CURVE) ---

[weather]
file = "weather.wgsl"
name = "Mellow Weather"

[budget]
gpu_ms = 0.1
