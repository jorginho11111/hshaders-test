# Mellow FULL for Horizon — the same conversion as mellow/, PLUS the lighting
# ([material]). This pack is for devices whose GPUs allow 19+ sampled textures
# per shader stage. On weaker phones (limit 16, common on mobile) the app's
# terrain pipeline refuses the whole pack with a validation message — that is
# an app-side layout the pack cannot slim down. The plain mellow/ pack (or the
# mellow-<version>.hshader asset) runs everywhere.
schema = 1
id = "mellow_full"
name = "Mellow Full"
version = "0.1.4"
api = "0.1"
description = "Mellow with its lighting (material stage): shaped block light, warm sunlight, reflections and atmospheric fog. Needs a GPU with 19+ texture slots."
authors = ["TheCMK (original Mellow shaderpack)", "Horizon WGSL conversion"]
license = "MIT"
shared = ["shared.wgsl"]

[material]
file = "material.wgsl"
name = "Mellow lighting"
fog = false

[weather]
file = "weather.wgsl"
name = "Mellow weather"

# One post pass (bloom + tone map + grade) — see mellow/post_final.wgsl.
[[post]]
file = "post_final.wgsl"
name = "Bloom, tone map and grade"

# --- Lighting (Mellow's composite colours and the light shaping) ---

[[options]]
id = "light_falloff"
name = "Light falloff"
description = "How softly light fades with distance (light_falloff, 1 is linear, 2 quadratic)."
type = "float"
default = 1.6
min = 0.5
max = 2.0
step = 0.1

[[options]]
id = "min_light"
name = "Min light"
description = "Never-full-dark floors, as in Mellow (min_light)."
type = "float"
default = 0.15
min = 0.0
max = 0.5
step = 0.01

[[options]]
id = "light_red"
name = "Warm light red"
description = "Boosts the red channel of block light (0 is neutral; torch light ~0.6)."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "light_green"
name = "Warm light green"
description = "Boosts the green channel of block light (0 is neutral)."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "light_blue"
name = "Warm light blue"
description = "Boosts the blue channel of block light (0 is neutral)."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "reflections"
name = "Water reflections"
description = "Reflect the world on water, with Mellow's ripples (REFLECTION)."
type = "bool"
default = true

[[options]]
id = "reflection_strength"
name = "Reflection strength"
description = "How shiny the water is (reflectionStrength)."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "atmospheric_fog"
name = "Atmospheric fog"
description = "Sun-tinted distance fog (Mellow's applyFog)."
type = "float"
default = 0.25
min = 0.0
max = 1.0
step = 0.05

[reflection]
option = "reflections"

# --- Weather ---

[[options]]
id = "weather_opacity"
name = "Weather opacity"
description = "How strongly rain and snow streaks show."
type = "float"
default = 1.0
min = 0.1
max = 1.0
step = 0.05

# --- Bloom (BLOOM_STRENGTH, BLOOM_CURVE) ---

[[options]]
id = "bloom_strength"
name = "Bloom strength"
description = "The soft halo around bright things (BLOOM_STRENGTH)."
type = "float"
default = 0.4
min = 0.0
max = 0.8
step = 0.02

[[options]]
id = "bloom_curve"
name = "Bloom curve"
description = "Where bloom starts to pick up brightness (BLOOM_CURVE)."
type = "float"
default = 0.5
min = 0.1
max = 1.0
step = 0.05

# --- Tone map and colour grade (Mellow's final pass) ---

[[options]]
id = "tonemap"
name = "Tone mapping"
description = "Uchimura is Mellow's default operator; AgX Punchy and the fitted ACES curve are two of its others."
type = "choice"
values = ["Uchimura", "AgX Punchy", "ACES", "None"]
default = "Uchimura"

[[options]]
id = "exposure"
name = "Exposure"
description = "How bright the tone mapper starts from."
type = "float"
default = 1.1
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "vibrance"
name = "Vibrance"
description = "Lifts the colours that are not already loud (Mellow's apply_vibrance)."
type = "float"
default = 1.2
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
description = "Colour strength (Mellow's apply_saturation)."
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
description = "Light and shadow separation (Mellow's apply_contrast)."
type = "float"
default = 1.0
min = 0.7
max = 1.3
step = 0.02

[[options]]
id = "vignette_opacity"
name = "Vignette opacity"
description = "How dark the picture's edges get (0 disables)."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vignette_falloff"
name = "Vignette falloff"
description = "How far the vignette reaches inward."
type = "float"
default = 0.75
min = 0.25
max = 1.75
step = 0.05

[[options]]
id = "film_grain"
name = "Film grain"
description = "Adds the film grain effect to the final image."
type = "bool"
default = false

[[options]]
id = "film_grain_strength"
name = "Film grain strength"
description = "How strong the film grain appears."
type = "float"
default = 0.05
min = 0.01
max = 0.5
step = 0.01

[budget]
frames = 3
max_ms = 16.0
scales = [1.0, 0.75, 0.5, 0.25]
